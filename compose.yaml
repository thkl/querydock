name: querydock

services:
  querydock:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    environment:
      NODE_ENV: production
      PORT: 3000
      QUERYDOCK_SERVER_HOST: 0.0.0.0
      QUERYDOCK_HTTP_BIND_ADDRESS: ${QUERYDOCK_HTTP_BIND_ADDRESS:-127.0.0.1}
      QUERYDOCK_ALLOWED_DATABASE_HOSTS: ${QUERYDOCK_ALLOWED_DATABASE_HOSTS:-}
    ports:
      - "${QUERYDOCK_HTTP_BIND_ADDRESS:-127.0.0.1}:${QUERYDOCK_HTTP_PORT:-8080}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
