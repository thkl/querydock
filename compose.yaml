name: querydock

services:
  querydock:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${QUERYDOCK_HTTP_PORT:-8080}:3000"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_DOCKER_NETWORK:-traefik}"
      traefik.http.routers.querydock.rule: "Host(`${QUERYDOCK_HOST:-querydock.localhost}`)"
      traefik.http.routers.querydock.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.querydock.tls: "${TRAEFIK_TLS:-true}"
      traefik.http.routers.querydock.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.services.querydock.loadbalancer.server.port: "3000"
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    name: "${TRAEFIK_DOCKER_NETWORK:-traefik}"
    external: true
