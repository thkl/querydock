@if (mobileTreeOpen()) {
  <button class="mobile-tree-backdrop" type="button" aria-label="Close database navigation" (click)="closeMobileTree()"></button>
}
<aside class="sidebar" [class.is-mobile-tree-open]="mobileTreeOpen()">
  <div class="sidebar-actions">
    <a class="sidebar-action" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileTree()">
      <span class="nav-icon">▦</span><span>Workspace</span>
    </a>
    <a class="sidebar-action" routerLink="/runbook" routerLinkActive="active" (click)="closeMobileTree()">
      <span class="nav-icon">▤</span><span>Runbook</span>
    </a>
  </div>
  <div class="sidebar-section-heading">
    <span>CONNECTIONS</span>
    <button class="tiny-icon-button mobile-tree-toggle" type="button" [attr.aria-expanded]="mobileTreeOpen()" aria-label="Toggle database navigation" title="Browse connections, schemas, and tables" (click)="toggleMobileTree()">☷</button>
    <button class="tiny-icon-button" type="button" aria-label="Add connection" title="Connect to a database" (click)="connections.openConnectDialog()">+</button>
  </div>
  <div class="resource-tree scrollbar">
    @if (connections.disconnectError()) {
      <p class="connection-error" role="alert">Could not disconnect: {{ connections.disconnectError() }}</p>
    }
    <agrid-tree
      class="database-tree"
      [provider]="treeProvider()"
      (nodeClick)="onTreeNodeClick($event)"
      (nodeMenuAction)="onTreeMenuAction($event)"
    />
  </div>
  <div class="sidebar-bottom">
    <div class="sidebar-footer"><span class="kbd">⌘ K</span><span>Quick actions</span></div>
  </div>
</aside>
