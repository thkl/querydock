<section class="workspace-empty" aria-label="Empty workspace">
  @if (connections.activeConnection()) {
    <section class="empty-card" aria-labelledby="empty-title">
      <span class="empty-icon" aria-hidden="true">▦</span>
      <p class="eyebrow">WORKSPACE</p>
      <h1 id="empty-title">No table structure open</h1>
      <p>Click a table in the sidebar to open its structure.</p>
    </section>
  } @else {
    <section class="empty-card" aria-labelledby="empty-title">
      <span class="empty-icon" aria-hidden="true">◉</span>
      <p class="eyebrow">WORKSPACE</p>
      <h1 id="empty-title">Connect to a database</h1>
      <p>Connect to a database, then click a table in the sidebar to open its structure.</p>
      <button class="connect-button" type="button" (click)="connections.openConnectDialog()">Add / Open connection</button>
    </section>
  }
</section>
